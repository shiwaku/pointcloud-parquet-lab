<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoParquet 点群ビューア</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0e11; color: #d7dde3; font: 13px/1.5 system-ui, "Segoe UI", sans-serif; }
  #deck-canvas { position: absolute; inset: 0 360px 0 0; width: calc(100% - 360px) !important; height: 100% !important; background: #0b0e11; }
  #panel { position: absolute; top: 0; right: 0; bottom: 0; width: 360px; box-sizing: border-box; padding: 18px 20px; overflow-y: auto; background: #12161b; border-left: 1px solid #222a33; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 2px; letter-spacing: .01em; }
  .sub { color: #8a95a1; margin: 0 0 18px; font-size: 12px; }
  section { border-top: 1px solid #222a33; padding: 14px 0; }
  section h2 { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #8a95a1; margin: 0 0 10px; }
  label.field { display: block; margin-bottom: 8px; }
  label.field span { display: block; font-size: 11px; color: #8a95a1; margin-bottom: 3px; }
  input[type=text] { width: 100%; box-sizing: border-box; background: #0b0e11; color: #d7dde3; border: 1px solid #2a333d; border-radius: 4px; padding: 6px 8px; font: 12px ui-monospace, Consolas, monospace; }
  button { background: #2b8a5e; color: #fff; border: 0; border-radius: 4px; padding: 7px 14px; font-weight: 600; cursor: pointer; }
  button.secondary { background: #2a333d; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; }
  .slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; margin-bottom: 10px; }
  .slider span.name { grid-column: 1 / -1; font-size: 11px; color: #8a95a1; }
  .slider input { width: 100%; }
  .slider b { font-weight: 500; font-variant-numeric: tabular-nums; min-width: 72px; text-align: right; }
  .modes { display: flex; gap: 0; border: 1px solid #2a333d; border-radius: 4px; overflow: hidden; }
  .modes label { flex: 1; text-align: center; padding: 6px 0; cursor: pointer; background: #0b0e11; }
  .modes input { display: none; }
  .modes input:checked + span { display: block; background: #2b8a5e; color: #fff; margin: -6px 0; padding: 6px 0; }
  .check { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  #status { min-height: 1.5em; color: #9fd3b6; font-size: 12px; word-break: break-all; }
  #status.error { color: #f0a0a0; }
  #stats div { display: flex; justify-content: space-between; padding: 2px 0; font-size: 12px; }
  #stats span { color: #8a95a1; }
  #stats b { font-weight: 500; font-variant-numeric: tabular-nums; }
  .help { color: #6f7a86; font-size: 11px; }
  .help code { font: 11px ui-monospace, Consolas, monospace; color: #9fb0c0; }
</style>
</head>
<body>
<canvas id="deck-canvas"></canvas>
<aside id="panel">
  <h1>GeoParquet 点群ビューア</h1>
  <p class="sub">GeoArrow struct&lt;x,y,z&gt; の Parquet を row group 単位で部分読みして表示する</p>

  <section>
    <h2>Parquet</h2>
    <label class="field"><span>本体 (row group 統計で必要な範囲だけ読む)</span>
      <input type="text" id="main-url" value="/data/09jc602_geoarrow.parquet"></label>
    <label class="field"><span>概観 (任意。1% サンプル。空欄なら本体のみ)</span>
      <input type="text" id="overview-url" value="/data/09jc602_geoarrow_overview.parquet"></label>
    <div class="row">
      <button id="open">Open</button>
      <button id="fit" class="secondary">全体表示</button>
    </div>
    <p id="status"></p>
  </section>

  <section>
    <h2>統計</h2>
    <div id="stats"></div>
  </section>

  <section>
    <h2>詳細読み込み</h2>
    <div class="slider">
      <span class="name">点数上限 (画面内の row group をこの点数まで読む)</span>
      <input type="range" id="budget" min="1" max="40" step="1" value="8"><b id="budget-val"></b>
    </div>
    <div class="slider">
      <span class="name">詳細を読み始める解像度 (これ未満は概観のみ)</span>
      <input type="range" id="threshold" min="0.05" max="4" step="0.05" value="0.5"><b id="threshold-val"></b>
    </div>
    <label class="check"><input type="checkbox" id="show-boxes" checked> row group の範囲を表示 (緑: 表示中 / 黄: 読込中)</label>
    <label class="check"><input type="checkbox" id="show-overview" checked> 概観の点を表示</label>
  </section>

  <section>
    <h2>描画</h2>
    <div class="slider">
      <span class="name">点の大きさ</span>
      <input type="range" id="point-size" min="0.5" max="6" step="0.5" value="1.5"><b id="point-size-val"></b>
    </div>
    <div class="modes">
      <label><input type="radio" name="mode" value="rgb" checked><span>RGB</span></label>
      <label><input type="radio" name="mode" value="elevation"><span>標高</span></label>
      <label><input type="radio" name="mode" value="class"><span>分類</span></label>
    </div>
  </section>

  <section>
    <p class="help">左ドラッグ: 回転 / 右ドラッグ または Shift+ドラッグ: 移動 / ホイール: ズーム<br>
    配信: <code>python viewer/serve.py</code> (Range 対応)。<code>?noauto</code> を付けると自動で開かない。</p>
  </section>
</aside>

<script src="https://cdn.jsdelivr.net/npm/deck.gl@9.3.11/dist.min.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
